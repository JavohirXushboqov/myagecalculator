.lk{display:flex;align-items:center;gap:14px;padding:18px;border-radius:16px;background:var(--input);border:1px solid var(--border);text-decoration:none;color:inherit;cursor:pointer;transition:.3s;position:relative;overflow:hidden}

.li{width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}

.modal-bg.active .modal{transform:scale(1)}
.mi{width:58px;height:58px;background:rgba(34,197,94,.15);color:#4ade80;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 16px;border:1px solid rgba(74,222,128,.3);animation:float 2.5s infinite}
.mt{font-size:1.15rem;font-weight:800;margin-bottom:6px}
.mx{font-size:.88rem;color:var(--muted);line-height:1.45;margin-bottom:20px}
.mb{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border:none;padding:12px;border-radius:11px;font-weight:700;cursor:pointer;width:100%}
.hidden{display:none!important}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.reveal.in{opacity:1;transform:none}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:2000;pointer-events:none;animation:fall linear forwards}
footer{text-align:center;color:var(--muted);font-size:.78rem;margin-top:34px;line-height:1.8}
footer a{color:#818cf8;text-decoration:none;font-weight:700}
@keyframes floatOrb{to{transform:translate(50px,40px)}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes flip{0%,60%{transform:rotate(0)}80%,100%{transform:rotate(180deg)}}
@keyframes zap{50%{transform:scale(1.4);color:#facc15}}
@keyframes shine{to{background-position:250% center}}
@keyframes sweep{0%,60%{left:-120%}100%{left:160%}}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}}
@keyframes pulseGlow{to{transform:scale(1.15);opacity:.9}}
@keyframes pulseB{to{box-shadow:0 0 20px rgba(56,189,248,.4)}}
@keyframes pulseI{to{box-shadow:0 0 20px rgba(244,114,182,.4)}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media(max-width:860px){.layout{grid-template-columns:1fr}.links{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,1fr)}}

.s-tg{background:linear-gradient(135deg,#0369a1,#0ea5e9);border-color:#38bdf8;box-shadow:0 8px 24px rgba(14,165,233,.25)}

<div class="container">
  <div class="hero">
    <div class="badge"><i class="fa-solid fa-bolt"></i> <span id="t-badge"></span></div>
    <h1>My Age Calculator</h1>
    <p id="t-hero-sub"></p>
  </div>

  <div class="layout">
    <div class="card reveal">
      <div class="card-h"><i class="fa-solid fa-calendar-check"></i> <span id="t-birth-title"></span></div>
      <form onsubmit="calculateAge(event)">
        <div class="inputs">
          <div class="ib"><label for="day" id="t-lbl-day"></label><input type="number" id="day" class="wi" placeholder="15" min="1" max="31" required></div>
          <div class="ib"><label for="month" id="t-lbl-month"></label><select id="month" class="wi" required></select></div>
          <div class="ib"><label for="year" id="t-lbl-year"></label><input type="number" id="year" class="wi" placeholder="2008" min="1900" required></div>
        </div>
        <div class="err" id="err"></div>
        <div class="btns">
          <button type="submit" class="btn b-calc"><i class="fa-solid fa-calculator"></i> <span id="t-btn-calc"></span></button>
          <button type="button" class="btn b-reset" onclick="clearAll()"><i class="fa-solid fa-rotate-left"></i> <span id="t-btn-reset"></span></button>
        </div>

    </div>

    <div class="card reveal" id="resCard">
      <div class="card-h"><i class="fa-solid fa-chart-simple"></i> <span id="t-res-header"></span></div>

        <div class="ad-num"><span id="adNum">0</span><small id="t-ad-unit"></small></div>
        <div class="ad-t" id="t-ad-title"></div>
        <div class="ad-s" id="t-ad-sub"></div>
        <span id="t-empty"></span>
      </div>
      <div id="results" class="hidden">
        <div class="res" id="resGrid">

    const b=document.createElement('button');b.className='zb';b.textContent=it[0];b.style.animationDelay=(i*40)+'ms';if((cat==='zodiac'?mine.z:mine.m)===i)b.classList.add('mine');
    b.onclick=()=>{document.querySelectorAll('.zb').forEach(x=>x.classList.remove('active'));b.classList.add('active');
      $('detTitle').textContent=it[0];$('detSub').textContent=it[1];$('detText').textContent=it[2];
      const v=$('detailView');v.classList.remove('hidden');v.style.animation='none';v.offsetHeight;v.style.animation=''};
    g.appendChild(b);
  });
}
function countUp(el,to,dur=900){
  const t0=performance.now();
  (function f(t){const p=Math.min((t-t0)/dur,1),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e).toLocaleString();if(p<1)requestAnimationFrame(f)})(t0);
}
function calculateAge(e){
  e.preventDefault();
  const d=+$('day').value,m=+$('month').value,y=+$('year').value,now=new Date(),err=$('err'),dict=i18n[lang];
  err.textContent='';
  const b=new Date(y,m-1,d);
  if(b.getFullYear()!==y||b.getMonth()!==m-1||b.getDate()!==d){err.textContent=dict.errDate;return}
  if(b>now){err.textContent=dict.errFuture;return}
  last={d,m,y};try{localStorage.setItem('age_dob',JSON.stringify(last))}catch(_){}
  reCalculate(true);
  if(window.innerWidth<860)$('resCard').scrollIntoView({behavior:'smooth',block:'center'});
}
function reCalculate(animate){
  const {d,m,y}=last,dict=i18n[lang],now=new Date(),birth=new Date(y,m-1,d);
  let years=now.getFullYear()-y,months=now.getMonth()-(m-1),days=now.getDate()-d;
  if(days<0){months--;days+=new Date(now.getFullYear(),now.getMonth(),0).getDate()}
  if(months<0){years--;months+=12}
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const totalDays=Math.round((today-birth)/864e5);
  let nb=new Date(now.getFullYear(),m-1,d);
  if(nb<today)nb=new Date(now.getFullYear()+1,m-1,d);
  const left=Math.round((nb-today)/864e5);
  $('empty').classList.add('hidden');$('results').classList.remove('hidden');
  const g=$('resGrid');
  if(animate){g.classList.remove('show');g.offsetHeight;g.classList.add('show');
    countUp($('resY'),years);countUp($('resM'),months);countUp($('resD'),days);countUp($('resTotalDays'),totalDays,1200);
  }else{g.classList.add('show');$('resY').textContent=years;$('resM').textContent=months;$('resD').textContent=days;$('resTotalDays').textContent=totalDays.toLocaleString()}
  const zk=d<ZD[m-1]?ZK[m-1]:ZK[m];
  $('resZodiac').textContent=dict.zodiacs[zk][0];
  $('resMuchal').textContent=dict.muchals[((y-4)%12+12)%12][0];
  $('resNextBday').textContent=left===0?dict.today:`${left} ${dict.lblD}`;
  if(animate&&left===0)confetti();
  mine={z:ZK.indexOf(zk),m:((y-4)%12+12)%12};snap={years,months,days,totalDays,left,zk,mi:mine.m};cardP=makeCard().catch(()=>null);renderGrid();
  $('resWd').textContent=dict.wdays[birth.getDay()];
  $('resHb').textContent='~'+Math.round(totalDays*1440*72/1e6).toLocaleString()+' '+dict.mln;
  const prev=new Date(nb.getFullYear()-1,m-1,d),pct=left===0?100:Math.max(0,Math.min(100,Math.round((today-prev)/(nb-prev)*100)));
  $('progPct').textContent=left===0?'🎉':`${left} ${dict.suffix}`;$('progBar').style.width='0';setTimeout(()=>$('progBar').style.width=pct+'%',60);
  shareTxt=`🎂 ${years} ${dict.lblY}, ${months} ${dict.lblM}, ${days} ${dict.lblD}\n${dict.lblZodiac}: ${dict.zodiacs[zk][0]} · ${dict.lblMuchal}: ${dict.muchals[mine.m][0]}\nMy Age Calculator${SITE?' · '+SITE:''}`;
  birthTs=birth.getTime();tick();clearInterval(timer);timer=setInterval(tick,1000);
}
function tick(){
  const s=Math.floor((Date.now()-birthTs)/1000);
  $('lvH').textContent=Math.floor(s/3600).toLocaleString();
  $('lvMin').textContent=Math.floor(s/60).toLocaleString();
  $('lvS').textContent=s.toLocaleString();
  $('lvW').textContent=Math.floor(s/604800).toLocaleString();
}
function confetti(){
  const c=['#6366f1','#38bdf8','#4ade80','#f472b6','#facc15'];
  for(let i=0;i<60;i++){const e=document.createElement('i');e.className='confetti';
    e.style.left=Math.random()*100+'vw';e.style.background=c[i%5];
    e.style.animationDuration=(2+Math.random()*2)+'s';e.style.animationDelay=Math.random()*.6+'s';
    document.body.appendChild(e);setTimeout(()=>e.remove(),5000)}
}
function clearAll(){
  $('day').value='';$('year').value='';$('err').textContent='';
  $('results').classList.add('hidden');$('empty').classList.remove('hidden');
  mine={z:-1,m:-1};renderGrid();try{localStorage.removeItem('age_dob')}catch(_){}
  last=null;snap=null;cardP=null;clearInterval(timer);
}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
async function makeCard(){
  const F='"Plus Jakarta Sans",sans-serif';
  try{await Promise.all([document.fonts.load('800 60px '+F),document.fonts.load('600 30px '+F)])}catch(_){}
  const W=1080,H=1920,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d'),d=i18n[lang],s=snap;
  const rr=(a,b,w,h,q)=>{x.beginPath();x.moveTo(a+q,b);x.arcTo(a+w,b,a+w,b+h,q);x.arcTo(a+w,b+h,a,b+h,q);x.arcTo(a,b+h,a,b,q);x.arcTo(a,b,a+w,b,q);x.closePath()};
  const t=(txt,a,b,z,w,col,mw)=>{x.textAlign='center';x.fillStyle=col;for(;;){x.font=`${w} ${z}px ${F}`;if(!mw||x.measureText(txt).width<=mw||z<16)break;z-=2}x.fillText(txt,a,b)};
  let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0b0f19');g.addColorStop(.55,'#1e1b4b');g.addColorStop(1,'#0c4a6e');x.fillStyle=g;x.fillRect(0,0,W,H);
  [[120,260,520,'99,102,241'],[980,1550,560,'14,165,233'],[900,760,380,'219,39,119']].forEach(([a,b,q,k])=>{g=x.createRadialGradient(a,b,0,a,b,q);g.addColorStop(0,`rgba(${k},.45)`);g.addColorStop(1,`rgba(${k},0)`);x.fillStyle=g;x.fillRect(0,0,W,H)});
  g=x.createLinearGradient(480,150,600,270);g.addColorStop(0,'#6366f1');g.addColorStop(1,'#3b82f6');x.fillStyle=g;rr(480,150,120,120,34);x.fill();
  x.font='64px sans-serif';x.fillStyle='#fff';x.textAlign='center';x.fillText('⏳',540,236);
  t('My Age Calculator',540,360,76,800,'#fff',900);
  t(d.badge,540,420,34,600,'#94a3b8',900);
  g=x.createLinearGradient(0,560,0,820);g.addColorStop(0,'#fff');g.addColorStop(1,'#a5b4fc');
  t(String(s.years),540,800,360,800,g,900);
  t(d.lblY,540,885,52,700,'#38bdf8');
  t(`${s.months} ${d.lblM}  ·  ${s.days} ${d.lblD}`,540,975,52,700,'#fff',940);
  [[d.lblTotalDays,s.totalDays.toLocaleString(),'#fff'],[d.lblNextBday,s.left?`${s.left} ${d.lblD}`:'🎉','#4ade80'],[d.lblZodiac,d.zodiacs[s.zk][0],'#38bdf8'],[d.lblMuchal,d.muchals[s.mi][0],'#818cf8']].forEach((k,i)=>{
    const a=75+(i%2)*480,b=1060+Math.floor(i/2)*190;
    x.fillStyle='rgba(15,23,42,.72)';rr(a,b,450,160,32);x.fill();x.strokeStyle='rgba(255,255,255,.14)';x.lineWidth=2;x.stroke();
    t(k[0],a+225,b+56,28,600,'#94a3b8',400);t(k[1],a+225,b+120,56,800,k[2],400)});
  t(d.adCta,540,1525,38,600,'#cbd5e1',900);
  g=x.createLinearGradient(140,0,940,0);g.addColorStop(0,'#6366f1');g.addColorStop(1,'#0ea5e9');x.fillStyle=g;rr(140,1565,800,130,65);x.fill();
  t('My Age Calculator',540,1648,62,800,'#fff',740);
  t('@javonex'+(SITE?'  ·  '+SITE.replace(/^https?:\/\//,''):''),540,1770,34,600,'#94a3b8',900);
  return new Promise(res=>cv.toBlob(res,'image/png'));
}
function saveImage(blob){
  const d=i18n[lang],name='my-age-calculator.png';
  if(window.Android&&window.Android.saveImage){const fr=new FileReader();fr.onload=()=>{window.Android.saveImage(fr.result.split(',')[1],name);toast(d.saved)};fr.readAsDataURL(blob);return}
  const u=URL.createObjectURL(blob);
  if(/; wv\)|WebView/i.test(navigator.userAgent)){$('imgPrev').src=u;$('imgModal').classList.add('active');return}
  const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);toast(d.saved);
}
async function downloadResult(){
  if(!snap)return;const d=i18n[lang];toast(d.making);
  let b=await(cardP||(cardP=makeCard()));if(!b)b=await makeCard();
  if(!b){toast(d.err);return}
  saveImage(b);
}
function openShare(){
  const T=encodeURIComponent(shareTxt),U=encodeURIComponent(SITE||'https://t.me/+_5tYgvH77_4yMTM6');
  const L=[['Telegram','fa-brands fa-telegram','https://t.me/share/url?url='+U+'&text='+T],['WhatsApp','fa-brands fa-whatsapp','https://wa.me/?text='+T],['Facebook','fa-brands fa-facebook','https://www.facebook.com/sharer/sharer.php?u='+U],['X','fa-brands fa-x-twitter','https://twitter.com/intent/tweet?text='+T],['SMS','fa-solid fa-message','sms:?body='+T],['Email','fa-solid fa-envelope','mailto:?subject=My%20Age%20Calculator&body='+T]];
  $('shGrid').innerHTML=L.map(l=>`<a href="${l[2]}" target="_blank" rel="noopener"><i class="${l[1]}"></i> ${l[0]}</a>`).join('');
  $('shareModal').classList.add('active');
}
async function shareResult(){
  if(!snap)return;const d=i18n[lang];
  let blob=await(cardP||(cardP=makeCard()));if(!blob)blob=await makeCard();
  if(!blob){toast(d.err);return}
  shareBlob=blob;const name='my-age-calculator.png';
  if(window.Android&&window.Android.shareImage){const fr=new FileReader();fr.onload=()=>window.Android.shareImage(fr.result.split(',')[1],name);fr.readAsDataURL(blob);return}
  if(navigator.share){
    try{
      const data={files:[new File([blob],name,{type:'image/png'})],title:'My Age Calculator',text:shareTxt};
      if(!navigator.canShare||navigator.canShare(data)){await navigator.share(data);return}
    }catch(e){if(e&&e.name==='AbortError')return}
  }
  openShare();
}
function openIG(e){

function showModal(){$('customModal').classList.add('active')}
function closeModal(e){if(e.target.id==='customModal')closeModalDirect()}
function closeModalDirect(){$('customModal').classList.remove('active')}

$('year').max=new Date().getFullYear();
{let sl='uz';try{sl=localStorage.getItem('age_lang')||'uz'}catch(_){}if(!i18n[sl])sl='uz';$('langSelect').value=sl;switchLanguage(sl)}
try{const s=JSON.parse(localStorage.getItem('age_dob'));if(s&&s.d&&s.m&&s.y){last=s;$('day').value=s.d;$('month').value=s.m;$('year').value=s.y;reCalculate(true)}}catch(_){}
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.12});
document.querySelectorAll('.reveal').forEach((el,i)=>{el.style.transitionDelay=(i%2*120)+'ms';io.observe(el)});

adLoop();setInterval(adLoop,3200);
